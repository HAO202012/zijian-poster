name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Precheck（文件齐全 / 无外链 / 无裸模块 import）
        run: node ci/precheck.mjs

      - name: Unit tests
        run: node ci/test.mjs

      - name: Smoke（静态服务 + 资源 200）
        run: node ci/smoke.mjs
